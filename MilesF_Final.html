<!DOCTYPE html>
<html>

  <head>
    <meta charset='utf-8' />
    <title>Miles's Guide to Mt. Bachelor</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <!--    Include the reference to the Mapbox JavaScript here in the <head> of the page  (Part I.1)  -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>


          
    <!--    Include the reference to the Mapbox CSS here in between <head> tags    (Part I.2) -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet">
    

    <style>
        /* Insert the additional CSS code here between the <style> tags  (Part I.4)   */
         body { margin:0; padding:0; }
         #map { position:absolute; top:0; bottom:0; width:100%; }
         #banner { z-index: 9999; 
         background-color:orange; 
         opacity: 80%; 
         text-align: center}

         /* .easy{color:green; 
            content: '&#x25CF;'
          } */
          .easy:after{
            color:green; 
            content: "\25CF";
          }
          /*
          Skinny diamond: \2666
          */
         .intermediate:after{color: blue; content:"\25A0";}
         .advanced:after{color:black; content:"\25C6";}

         .iconSize{
          font-size: 2em;
         }
        




    </style>
  </head>

  <body>
    <!--  Insert the map div here in the <body> of the page  (Part I)  -->
          <!--  Insert the map div here in the <body> of the page  (Part I)  -->
      <div id='map'></div>
      
        <!--  Insert the title div here (part VI) -->
      <div id='banner'>
        <h1>Miles's Guide to Mt. Bachelor</h1>
        
      </div>
  

    <script>
        // Insert the JavaScript within the <script> tags, within the body   
        // Start with the Mapbox access token here (Part 2.1)
        mapboxgl.accessToken = 'pk.eyJ1IjoibWFnaWNtbHoiLCJhIjoiY21uaHoxMmRtMDhrYzJvcHA4bjltZDA5biJ9.zufq2zkAjUxIm0wwN4PrkA';
 
   
        // Then initialize the map here (Part 2.2)
        var bounds = [
          [-122.07934674081297, 43.724741328583406], // Southwest coordinates
          [-121.27086762672273, 44.24754760915758] // Northeast coordinates 
        ];

        var map = new mapboxgl.Map({
            container: 'map', // id of a div on your page, where the map will be inserted
            style: 'mapbox://styles/magicmlz/cmow07616004f01sy9faaanqc', // stylesheet location
            center: [-121.682, 43.981], // starting position [lng, lat] eg. [-122.6788, 45.5212]
            zoom: 13.5, // starting zoom
            minZoom: 11.5,
            maxBounds: bounds //
          
        });

        map.on('load', () => {

            // Add the zoom contols here (part V)
            map.addControl(new mapboxgl.NavigationControl({showCompass: true}), 'bottom-right');
            // Add popups for markers here. Yes, before the markers!  (part IV)
            
            
            // Add any other variables such as markers here (part III)
            // var SkiRuns = map.getLayer("SkiRunColor");
            // //console.log(SkiRuns);

                map.on('click', "SkiRunColor", function (e) {
                  console.log(e.features)
                       // var coordinates = e.features[0].geometry.coordinates.slice();
                        var description = e.features[0].properties.description;
                        var difficulty = e.features[0].properties.difficulty;

                  console.log(e.lngLat);

                      popupContent = "<span class='" + difficulty + " iconSize'>  </span>" + difficulty 

                        new mapboxgl.Popup()
                        .setLngLat(e.lngLat)
                        .setHTML(popupContent) // the string in the description var is added to the popup here
                        .addTo(map);
                });

            map.on('mouseenter',  "SkiRunColor", function () {
                map.getCanvas().style.cursor = 'pointer';
            });

            // Change it back to a pointer when it leaves.
            map.on('mouseleave',  "SkiRunColor", function () {
                  map.getCanvas().style.cursor = '';
            });

            // Add optional advanced "On load" function here
        });  
        
    </script>

  </body>

</html>
